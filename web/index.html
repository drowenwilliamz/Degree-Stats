<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Degree Results Dashboard</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">Degree results</p>
        <h1>Cohort module dashboard</h1>
      </div>
      <div class="source-pill" id="sourceSummary"></div>
    </header>

    <main>
      <section class="controls" aria-label="Filters">
        <label>
          <span>Level</span>
          <select id="levelFilter"></select>
        </label>
        <label>
          <span>Year</span>
          <select id="yearFilter"></select>
        </label>
        <label>
          <span>Metric</span>
          <select id="metricFilter">
            <option value="mean">Mean mark</option>
            <option value="median">Median mark</option>
            <option value="passRate">Pass rate</option>
            <option value="failRate">Fail rate</option>
            <option value="firstRate">70+ rate</option>
            <option value="stdev">Spread</option>
          </select>
        </label>
        <label class="search">
          <span>Find module</span>
          <input id="searchFilter" type="search" placeholder="Thermo, ACHA5011, maths">
        </label>
      </section>

      <nav class="tabs" aria-label="Views">
        <button class="tab active" type="button" data-view="overview">Overview</button>
        <button class="tab" type="button" data-view="modules">Modules</button>
        <button class="tab" type="button" data-view="bridge">Validation bridge</button>
      </nav>

      <section id="overviewView" class="view active">
        <div class="kpis" id="kpis"></div>
        <div class="chart-grid">
          <section class="panel wide">
            <div class="panel-heading">
              <h2>Module means by cohort</h2>
              <select id="moduleSelect"></select>
            </div>
            <div id="trendChart" class="chart"></div>
          </section>
          <section class="panel">
            <h2>Mark bands</h2>
            <div id="bandChart" class="chart"></div>
          </section>
        </div>
        <section class="panel">
          <div class="panel-heading">
            <h2>Selected module detail</h2>
            <div id="selectedMeta" class="muted"></div>
          </div>
          <div id="moduleDetail" class="detail-grid"></div>
        </section>
      </section>

      <section id="modulesView" class="view">
        <section class="panel">
          <div class="panel-heading">
            <h2>Module-year records</h2>
            <button id="exportCsv" type="button">Export CSV</button>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Year</th>
                  <th>Level</th>
                  <th>Code</th>
                  <th>Module</th>
                  <th>N</th>
                  <th>Mean</th>
                  <th>Median</th>
                  <th>Pass</th>
                  <th>70+</th>
                  <th>Spread</th>
                </tr>
              </thead>
              <tbody id="moduleTable"></tbody>
            </table>
          </div>
        </section>
      </section>

      <section id="bridgeView" class="view">
        <section class="panel">
          <div class="panel-heading">
            <div>
              <h2>Year one validation bridge</h2>
              <p class="muted">Content areas roll related old and new Level 4 modules together using credit-weighted marks.</p>
            </div>
            <select id="bridgeMetric">
              <option value="mean">Mean mark</option>
              <option value="passRate">Pass rate</option>
              <option value="failRate">Fail rate</option>
              <option value="firstRate">70+ rate</option>
            </select>
          </div>
          <div id="bridgeChart" class="bridge-grid"></div>
        </section>
      </section>
    </main>

    <script src="degree_results_data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
